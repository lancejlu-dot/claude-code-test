<title>Tic Tac Toe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column — header, mode switch, scoreboard, square board drawn on graph paper, status line */
:root {
  --paper: #f3f5f8;
  --grid: #dde3ec;
  --ink: #1d2433;
  --muted: #5f6b80;
  --x: #2350d8;
  --o: #d8402f;
  --surface: #ffffff;
  --line: #1d2433;
  --win: #f5c84b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161f; --grid: #1e2533; --ink: #e8ecf4; --muted: #94a0b6;
    --x: #7a9bff; --o: #ff7a68; --surface: #1a202c; --line: #c9d1e0; --win: #8a6d1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161f; --grid: #1e2533; --ink: #e8ecf4; --muted: #94a0b6;
  --x: #7a9bff; --o: #ff7a68; --surface: #1a202c; --line: #c9d1e0; --win: #8a6d1c;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 2rem 3rem;
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3rem);
  letter-spacing: -0.03em; margin: 0; line-height: 1; text-wrap: balance;
}
h1 .x { color: var(--x); } h1 .o { color: var(--o); }
.modes { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.modes button {
  font: 500 0.9rem var(--font-body); padding: 0.5rem 0.9rem; border-radius: 999px;
  border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.score {
  background: var(--surface); border: 1.5px solid var(--grid); border-radius: 10px;
  padding: 0.6rem 0.75rem; display: flex; flex-direction: column; gap: 0.15rem;
}
.score.turn { border-color: currentColor; }
.score.sx { color: var(--x); } .score.so { color: var(--o); } .score.sd { color: var(--muted); }
.score span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.score b { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.1; }
.board {
  position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
  aspect-ratio: 1; max-width: 100%; width: 100%;
}
.cell {
  appearance: none; border: 0; background: transparent; padding: 12%; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); border-radius: 6px;
}
.cell:nth-child(-n+6) { border-bottom: 4px solid var(--line); }
.cell:not(:nth-child(3n)) { border-right: 4px solid var(--line); }
.cell:nth-child(-n+6), .cell:not(:nth-child(3n)) { border-radius: 0; }
.cell:hover:not(:disabled) { background: color-mix(in srgb, var(--grid) 60%, transparent); }
.cell:focus-visible { outline: 3px solid var(--x); outline-offset: -6px; }
.cell:disabled { cursor: default; }
.cell svg { width: 100%; height: 100%; overflow: visible; }
.cell path, .cell circle { fill: none; stroke-width: 12; stroke-linecap: round; }
.cell .mx { stroke: var(--x); } .cell .mo { stroke: var(--o); }
.cell .draw { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 0.28s ease-out forwards; }
.cell .draw.second { animation-delay: 0.14s; }
.cell.win { background: color-mix(in srgb, var(--win) 45%, transparent); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.status { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
#msg { font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; margin: 0; }
#again {
  font: 600 0.95rem var(--font-body); padding: 0.6rem 1.1rem; border-radius: 8px; border: 0;
  background: var(--ink); color: var(--paper); cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--x); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
@media (prefers-reduced-motion: reduce) {
  .cell .draw { animation: none; stroke-dashoffset: 0; }
}
</style>

<main class="wrap">
  <h1>Tic <span class="x">Tac</span> <span class="o">Toe</span></h1>

  <div class="modes" role="group" aria-label="Opponent">
    <button id="mode-cpu" aria-pressed="true">vs Computer</button>
    <button id="mode-pvp" aria-pressed="false">2 Players</button>
  </div>

  <div class="scores">
    <div class="score sx" id="score-x"><span id="label-x">You · X</span><b id="wins-x">0</b></div>
    <div class="score sd"><span>Draws</span><b id="draws">0</b></div>
    <div class="score so" id="score-o"><span id="label-o">Computer · O</span><b id="wins-o">0</b></div>
  </div>

  <div class="board" id="board" role="grid" aria-label="Board"></div>

  <div class="status">
    <p id="msg" aria-live="polite">Your move</p>
    <button id="again">New game</button>
  </div>
  <p class="hint">Three in a row wins. X goes first, then starting turns alternate each game. The computer plays a perfect game, so a draw is a good result.</p>
</main>

<script>
(() => {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById('board');
  const msg = document.getElementById('msg');
  const $ = id => document.getElementById(id);

  let state = { cells: Array(9).fill(null), turn: 'X', starter: 'X', over: false, cpu: true, score: { X: 0, O: 0, D: 0 } };

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.id = 'cell-' + i;
    b.setAttribute('aria-label', 'Row ' + (Math.floor(i / 3) + 1) + ', column ' + (i % 3 + 1) + ', empty');
    b.addEventListener('click', () => humanMove(i));
    boardEl.appendChild(b);
    cells.push(b);
  }

  function winner(c) {
    for (const l of LINES) {
      const [a, b, d] = l;
      if (c[a] && c[a] === c[b] && c[a] === c[d]) return { p: c[a], line: l };
    }
    return c.every(Boolean) ? { p: 'D', line: [] } : null;
  }

  function minimax(c, player, depth) {
    const w = winner(c);
    if (w) return { s: w.p === 'O' ? 10 - depth : w.p === 'X' ? depth - 10 : 0 };
    let best = { s: player === 'O' ? -Infinity : Infinity, i: -1 };
    for (let i = 0; i < 9; i++) {
      if (c[i]) continue;
      c[i] = player;
      const r = minimax(c, player === 'O' ? 'X' : 'O', depth + 1);
      c[i] = null;
      if (player === 'O' ? r.s > best.s : r.s < best.s) best = { s: r.s, i };
    }
    return best;
  }

  function cpuPick() {
    const empty = state.cells.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    if (empty.length === 9) return [0, 2, 4, 6, 8][Math.floor(Math.random() * 5)];
    return minimax(state.cells.slice(), 'O', 0).i;
  }

  function mark(p) {
    if (p === 'X') return '<svg viewBox="0 0 100 100"><path class="mx draw" d="M20 20 L80 80"/><path class="mx draw second" d="M80 20 L20 80"/></svg>';
    return '<svg viewBox="0 0 100 100"><circle class="mo draw" cx="50" cy="50" r="32" transform="rotate(-90 50 50)"/></svg>';
  }

  function place(i) {
    const p = state.turn;
    state.cells[i] = p;
    cells[i].innerHTML = mark(p);
    cells[i].setAttribute('aria-label', cells[i].getAttribute('aria-label').replace('empty', p));
    const w = winner(state.cells);
    if (w) {
      state.over = true;
      if (w.p === 'D') state.score.D++; else state.score[w.p]++;
      w.line.forEach(k => cells[k].classList.add('win'));
    } else {
      state.turn = p === 'X' ? 'O' : 'X';
    }
    render();
  }

  function humanMove(i) {
    if (state.over || state.cells[i]) return;
    if (state.cpu && state.turn === 'O') return;
    place(i);
    maybeCpu();
  }

  function maybeCpu() {
    if (state.cpu && !state.over && state.turn === 'O') {
      render(true);
      setTimeout(() => { if (!state.over && state.turn === 'O') place(cpuPick()); }, 420);
    }
  }

  function name(p) {
    if (state.cpu) return p === 'X' ? 'You' : 'The computer';
    return 'Player ' + p;
  }

  function render(thinking) {
    state.cells.forEach((v, i) => {
      cells[i].disabled = state.over || !!v || (state.cpu && state.turn === 'O');
    });
    $('wins-x').textContent = state.score.X;
    $('wins-o').textContent = state.score.O;
    $('draws').textContent = state.score.D;
    $('label-x').textContent = state.cpu ? 'You · X' : 'Player X';
    $('label-o').textContent = state.cpu ? 'Computer · O' : 'Player O';
    $('score-x').classList.toggle('turn', !state.over && state.turn === 'X');
    $('score-o').classList.toggle('turn', !state.over && state.turn === 'O');
    $('mode-cpu').setAttribute('aria-pressed', String(state.cpu));
    $('mode-pvp').setAttribute('aria-pressed', String(!state.cpu));

    const w = state.over ? winner(state.cells) : null;
    if (w && w.p === 'D') msg.textContent = "It's a draw";
    else if (w) msg.textContent = state.cpu ? (w.p === 'X' ? 'You win!' : 'The computer wins') : 'Player ' + w.p + ' wins!';
    else if (thinking) msg.textContent = 'Computer is thinking…';
    else msg.textContent = state.cpu && state.turn === 'X' ? 'Your move' : name(state.turn) + "'s move";
  }

  function newGame(resetStarter) {
    state.starter = resetStarter ? 'X' : (state.starter === 'X' ? 'O' : 'X');
    state.cells = Array(9).fill(null);
    state.turn = state.starter;
    state.over = false;
    cells.forEach((c, i) => {
      c.innerHTML = '';
      c.classList.remove('win');
      c.setAttribute('aria-label', 'Row ' + (Math.floor(i / 3) + 1) + ', column ' + (i % 3 + 1) + ', empty');
    });
    render();
    maybeCpu();
  }

  function setMode(cpu) {
    if (state.cpu === cpu) return;
    state.cpu = cpu;
    state.score = { X: 0, O: 0, D: 0 };
    newGame(true);
  }

  $('again').addEventListener('click', () => newGame(false));
  $('mode-cpu').addEventListener('click', () => setMode(true));
  $('mode-pvp').addEventListener('click', () => setMode(false));

  render();
})();
</script>
